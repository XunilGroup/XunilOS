[package]
name = "XunilOS"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "XunilOS"
test = false
bench = false

[dependencies]
font8x8 = { version = "0.3.1", default-features = false }
heapless = "0.9.2"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
limine = "0.5"
pc-keyboard = "0.8.0"
spin = "0.10.0"
static_cell = "2.1.1"

[target.'cfg(target_arch = "x86_64")'.dependencies]
pic8259 = "0.11.0"
x86_64 = "0.15.4"

[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu = "11.2.0"
fdt = "0.1.5"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
