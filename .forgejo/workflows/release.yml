name: Build & Release XunilOS

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.karch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        karch:
          - x86_64
          - aarch64

    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            binutils \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-amd64-cross \
            libc6-dev-arm64-cross \
            xorriso \
            curl \
            ccache \
            mold

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.karch }}-unknown-none

      - name: Create assets directory
        run: mkdir -p assets/${{ matrix.karch }}

      - name: Run build script
        env:
          KARCH: ${{ matrix.karch }}
        run: bash build_all.sh

      - name: Upload ISO artifact
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: ${{ matrix.karch }}
          path: XunilOS-${{ matrix.karch }}.iso
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download All Build Artifacts
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          path: downloads
      - name: Release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
        run: |
          git config user.email "ci@ci" && git config user.name "CI"
          git tag -f latest && git push -f origin latest

          RELEASE_ID=$(curl -sf -H "Authorization: token $TOKEN" \
            "$API/repos/$REPO/releases/tags/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)

          [ -n "$RELEASE_ID" ] && curl -sf -X DELETE \
            -H "Authorization: token $TOKEN" \
            "$API/repos/$REPO/releases/$RELEASE_ID"

          RELEASE_ID=$(curl -sf -X POST \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            "$API/repos/$REPO/releases" \
            -d "{\"tag_name\":\"latest\",\"name\":\"Latest Release\",\"draft\":false,\"prerelease\":false,\"body\":\"Automated build for commit ${{ github.sha }}\n\n## Downloads\n- Aarch64: \`XunilOS-aarch64.iso\`\n- x86_64: \`XunilOS-x86_64.iso\`\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          for FILE in downloads/aarch64/XunilOS-aarch64.iso \
                      downloads/x86_64/XunilOS-x86_64.iso; do
            curl -sf -X POST \
              -H "Authorization: token $TOKEN" -H "Content-Type: application/octet-stream" \
              "$API/repos/$REPO/releases/$RELEASE_ID/assets?name=$(basename $FILE)" \
              --data-binary "@$FILE"
          done
